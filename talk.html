<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LinguaMate 对话实时翻译</title>
<style>
  :root{--bg:#0a0c11;--card:#141821;--line:#232a38;--txt:#eef2f8;--dim:#8b93a7;--acc:#4f8cff;--warn:#f0b429;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
       padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header a{margin-left:auto;color:var(--dim);font-size:12px;text-decoration:none}
  .dir{display:flex;gap:8px;margin-bottom:10px}
  .dir button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-weight:600;font-size:14px}
  .dir button.on{background:#1c2740;border-color:var(--acc);color:#dfe8ff}
  .big{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .label{font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.05em}
  #dst{font-size:clamp(22px,7vw,38px);line-height:1.3;font-weight:600;white-space:pre-wrap;min-height:1.3em;color:#fff}
  #dst.wait{color:var(--dim);font-size:20px;font-weight:400}
  #input{width:100%;min-height:120px;background:var(--card);border:1px solid var(--line);border-radius:16px;
         color:var(--txt);padding:14px;font:17px/1.6 inherit;outline:none;resize:vertical}
  #input:focus{border-color:var(--acc)}
  .tip{font-size:13px;color:var(--warn);margin:8px 2px;line-height:1.6}
  .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .tools button{flex:1;min-width:96px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:13px}
  #hold{width:100%;margin-top:10px;padding:16px;border-radius:16px;border:1px solid var(--acc);
        background:linear-gradient(180deg,#2b4f96,#1d355f);color:#fff;font-size:16px;font-weight:700;user-select:none}
  #hold.rec{background:linear-gradient(180deg,#b8452b,#7a2418)}
  #status{font-size:12px;color:var(--dim);margin-top:8px;min-height:16px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>对话实时翻译</h1>
  <a href="./">← 回到翻译页</a>
</header>

<div class="dir">
  <button id="d-zh" class="on">我说中文 → 英文</button>
  <button id="d-en">I speak English → 中文</button>
</div>

<div class="big">
  <div class="label">给对方看 · TO THEM</div>
  <div id="dst" class="wait">在下面说话或打字，这里出译文</div>
</div>

<textarea id="input" placeholder="点这里，然后用键盘上的 🎤 说话（或直接打字）"></textarea>
<div class="tip" id="tip">💡 点上面输入框 → 键盘弹出后长按空格旁的 🎤 → 说话 → 字出来后自动翻译</div>

<button id="hold" style="display:none">按住说话（浏览器语音）</button>

<div class="tools">
  <button id="copy">复制译文</button>
  <button id="clr">清空</button>
  <button id="setkey">设置 key</button>
</div>
<div id="status"></div>

<script>
const $ = s => document.querySelector(s);
const MM = 'https://api.mymemory.translated.net/get';
const DS = 'https://api.deepseek.com/chat/completions';
const status = t => { $('#status').textContent = t || ''; };

let dir = localStorage.getItem('rt_dir') || 'zh';
let timer = null, lastDone = '';

const setWait = t => { const d = $('#dst'); d.className = 'wait'; d.textContent = t; };
const setOut = t => { const d = $('#dst'); d.className = ''; d.textContent = t; };

async function translate(text) {
  const key = localStorage.getItem('lm_key') || '';
  const toEN = dir === 'zh';
  if (key) {
    const sys = `你是专业译者。把下面的${toEN ? '中文' : '英文'}翻译成${toEN ? '英文' : '中文'}，只输出译文，自然口语，不要解释。`;
    const r = await fetch(DS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({ model: 'deepseek-chat', temperature: 0.2,
        messages: [{ role: 'system', content: sys }, { role: 'user', content: text }] })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || ('接口 ' + r.status));
    return j.choices[0].message.content.trim();
  }
  const r = await fetch(`${MM}?q=${encodeURIComponent(text)}&langpair=${toEN ? 'zh-CN|en' : 'en|zh-CN'}`);
  const j = await r.json();
  if (Number(j.responseStatus) !== 200) throw new Error(j.responseDetails || '免费接口异常');
  return j.responseData.translatedText;
}

async function handle(text) {
  text = (text || '').trim();
  if (!text) return;
  if (text === lastDone) return;
  setWait('翻译中…');
  try {
    const out = await translate(text);
    lastDone = text;
    setOut(out);
    status('');
  } catch (e) {
    setWait('翻译失败');
    status(e.message.slice(0, 60));
  }
}

// 打字/语音输入：停顿 0.9 秒自动翻
$('#input').addEventListener('input', () => {
  clearTimeout(timer);
  const v = $('#input').value.trim();
  if (!v) { setWait('在下面说话或打字，这里出译文'); return; }
  setWait('…');
  timer = setTimeout(() => handle(v), 900);
});

function setDir(d) {
  dir = d;
  localStorage.setItem('rt_dir', d);
  $('#d-zh').classList.toggle('on', d === 'zh');
  $('#d-en').classList.toggle('on', d === 'en');
  lastDone = '';
  const v = $('#input').value.trim();
  if (v) handle(v);
}
$('#d-zh').onclick = () => setDir('zh');
$('#d-en').onclick = () => setDir('en');

$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#dst').textContent); status('已复制'); }
  catch { status('复制失败，长按选中复制'); }
};
$('#clr').onclick = () => { $('#input').value = ''; lastDone = ''; setWait('在下面说话或打字，这里出译文'); status(''); };
$('#setkey').onclick = () => {
  const k = prompt('粘贴 DeepSeek API key（只存本机，留空用免费接口）', localStorage.getItem('lm_key') || '');
  if (k !== null) { localStorage.setItem('lm_key', k.trim()); status(k.trim() ? '已保存 key' : '已清空 key，用免费接口'); }
};

// 浏览器原生语音（支持才显示；不支持就用输入法那条路）
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const hold = $('#hold');
  hold.style.display = 'block';
  hold.textContent = '按住说话（浏览器语音，需麦克风权限）';
  let rec = new SR(), recording = false, buf = '';
  rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { recording = true; buf = ''; hold.classList.add('rec'); hold.textContent = '正在听…松手结束'; };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) buf += t; else interim += t;
    }
    if (interim) setWait(interim);
  };
  rec.onerror = e => {
    const map = { 'not-allowed': '浏览器没有麦克风权限（去系统设置里给浏览器开麦克风）',
                  'service-not-allowed': '系统不允许语音识别，用上面的输入法 🎤',
                  'no-speech': '没听到声音', 'network': '语音服务连不上（Google 服务被墙），用输入法 🎤' };
    status(map[e.error] || ('识别出错：' + e.error));
  };
  rec.onend = () => {
    recording = false; hold.classList.remove('rec'); hold.textContent = '按住说话（浏览器语音）';
    if (buf.trim()) { $('#input').value = buf.trim(); handle(buf.trim()); }
  };
  const start = e => {
    e.preventDefault();
    if (recording) return;
    rec.lang = dir === 'zh' ? 'zh-CN' : 'en-US';
    try { rec.start(); } catch {}
  };
  hold.addEventListener('pointerdown', start);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => hold.addEventListener(ev, () => { if (recording) { try { rec.stop(); } catch {} } }));
}

$('#input').value = localStorage.getItem('rt_text') || '';
$('#input').addEventListener('change', () => localStorage.setItem('rt_text', $('#input').value));
if ($('#input').value) handle($('#input').value);
status('停顿一下自动翻译；说错了直接在框里改');
</script>
</body>
</html>
