<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>文档双语工坊 · LinguaMate</title>
<style>
  :root{--bg:#0a0c11;--card:#141821;--line:#232a38;--txt:#eef2f8;--dim:#8b93a7;--acc:#4f8cff;--ok:#2ecc71;--warn:#f0b429;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:14px 14px 40px}
  header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  header h1{font-size:18px;margin:0}
  header a{margin-left:auto;color:var(--dim);font-size:12px;text-decoration:none}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
  textarea,input,select{width:100%;background:#0f131b;border:1px solid var(--line);border-radius:12px;color:var(--txt);
    padding:12px;font:15px/1.6 inherit;outline:none}
  textarea:focus,input:focus{border-color:var(--acc)}
  #doc{min-height:180px}
  #gloss{min-height:74px;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{flex:1;min-width:104px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#1a2030;
    color:var(--txt);font-size:15px;font-weight:600}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.45}
  #bar{height:8px;background:#0f131b;border-radius:99px;overflow:hidden;margin-top:12px;display:none}
  #bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f8cff,#7ab6ff);transition:width .25s}
  #status{font-size:13px;color:var(--dim);margin-top:8px;min-height:20px}
  #out{margin-top:6px}
  .seg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .seg .src{color:var(--dim);font-size:14px;white-space:pre-wrap}
  .seg .dst{font-size:16px;margin-top:8px;white-space:pre-wrap}
  .seg .n{font-size:11px;color:var(--dim);margin-bottom:6px}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  .err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1>文档双语工坊</h1>
  <a href="./">← 回到翻译页</a>
</header>

<div class="panel">
  <label>① 原文（整篇粘进来，中文或英文都行）</label>
  <textarea id="doc" placeholder="把整篇论文 / 合同 / 邮件 / 说明粘进来……"></textarea>
  <div class="hint">支持中英混排，会自动判断每段方向。粘贴后会按段落切分，太长的段会自动拆。</div>
</div>

<div class="panel">
  <label>② 术语表（一行一条：原文=译文，可留空）</label>
  <textarea id="gloss" placeholder="腾讯=Tencent&#10;智囊团=ExpertHub&#10;数据标注=data annotation"></textarea>
  <label style="margin-top:12px">③ 引擎</label>
  <select id="engine">
    <option value="free">免费接口（免 key，质量一般，适合试跑）</option>
    <option value="llm">DeepSeek（需 key，质量好，术语表才真生效）</option>
  </select>
  <div class="hint" id="keyhint"></div>
</div>

<div class="row">
  <button class="primary" id="go">开始处理</button>
  <button id="stop" disabled>停止</button>
</div>
<div id="bar"><i></i></div>
<div id="status"></div>

<div class="row" id="exports" style="display:none">
  <button id="word">导出 Word</button>
  <button id="md">导出 Markdown</button>
  <button id="copy">复制译文</button>
</div>

<div id="out"></div>

<script>
const $ = s => document.querySelector(s);
const MM = 'https://api.mymemory.translated.net/get';
const DS = 'https://api.deepseek.com/chat/completions';
const status = (t, err) => { const el = $('#status'); el.textContent = t || ''; el.className = err ? 'err' : ''; };
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const isCJK = s => { const h = (s.match(/[\u4e00-\u9fff]/g) || []).length, a = (s.match(/[A-Za-z0-9]/g) || []).length; return h / Math.max(1, h + a) > 0.2; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

let segs = [];          // [{src, dst, dir}]
let stopped = false;

const keyOf = () => localStorage.getItem('lm_key') || '';
function refreshHint() {
  const hasKey = !!keyOf();
  $('#keyhint').textContent = hasKey ? '已保存 key，可直接用 DeepSeek' : '没有 key：DeepSeek 模式会失败，可在主页面「设置」里填';
}

// ---------- 切段 ----------
function splitDoc(text) {
  const raw = text.replace(/\r/g, '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const p of raw) {
    if (p.length <= 1200) { out.push(p); continue; }
    // 超长段落按句号切
    let buf = '';
    for (const s of p.split(/(?<=[。！？.!?])\s*/)) {
      if ((buf + s).length > 1000 && buf) { out.push(buf.trim()); buf = ''; }
      buf += s;
    }
    if (buf.trim()) out.push(buf.trim());
  }
  return out;
}

function glossaryPairs() {
  return $('#gloss').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.split(/=|->|→/);
    return m.length >= 2 ? [m[0].trim(), m.slice(1).join('=').trim()] : null;
  }).filter(Boolean);
}

// ---------- 翻译 ----------
async function mmTranslate(text, src, dst) {
  const chunks = [];
  let buf = '';
  for (const s of text.split(/(?<=[。！？.!?\n])/)) {
    if ((buf + s).length > 450 && buf) { chunks.push(buf); buf = ''; }
    buf += s;
  }
  if (buf) chunks.push(buf);
  let out = '';
  for (const c of chunks) {
    let ok = false;
    for (let i = 0; i < 3 && !ok; i++) {
      try {
        const r = await fetch(`${MM}?q=${encodeURIComponent(c)}&langpair=${src}|${dst}`);
        const j = await r.json();
        if (Number(j.responseStatus) !== 200) throw new Error(j.responseDetails || '接口异常');
        out += j.responseData.translatedText; ok = true;
      } catch (e) { if (i === 2) throw e; await sleep(1200 * (i + 1)); }
    }
  }
  return out;
}

async function llmTranslate(text, toEN, gloss) {
  const key = keyOf();
  if (!key) throw new Error('没有 API key，去主页面设置里填，或改用免费接口');
  const g = gloss.length ? '\n术语表（必须严格遵守）：\n' + gloss.map(([a, b]) => `${a} = ${b}`).join('\n') : '';
  const sys = `你是专业译者。把下面的${toEN ? '中文' : '英文'}翻译成${toEN ? '英文' : '中文'}，保持段落和换行结构，只输出译文，不要解释、不要加引号。${g}`;
  const r = await fetch(DS, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({ model: 'deepseek-chat', temperature: 0.2,
      messages: [{ role: 'system', content: sys }, { role: 'user', content: text }] })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('接口 ' + r.status));
  return j.choices[0].message.content.trim();
}

function render() {
  $('#out').innerHTML = segs.map((s, i) => `
    <div class="seg">
      <div class="n">#${i + 1} · ${s.dir}</div>
      <div class="src">${esc(s.src)}</div>
      <div class="dst">${esc(s.dst)}</div>
    </div>`).join('');
}

async function run() {
  const text = $('#doc').value.trim();
  if (!text) return status('先把原文粘进来', true);
  const engine = $('#engine').value;
  const gloss = glossaryPairs();
  const parts = splitDoc(text);
  segs = []; stopped = false; render();
  $('#bar').style.display = 'block';
  $('#go').disabled = true; $('#stop').disabled = false;
  $('#exports').style.display = 'none';

  for (let i = 0; i < parts.length; i++) {
    if (stopped) { status(`已停止，完成 ${i}/${parts.length} 段`); break; }
    const p = parts[i], toEN = isCJK(p);
    status(`正在处理 ${i + 1}/${parts.length} …`);
    $('#bar>i').style.width = Math.round((i / parts.length) * 100) + '%';
    try {
      let t = engine === 'llm'
        ? await llmTranslate(p, toEN, gloss)
        : await mmTranslate(p, toEN ? 'zh-CN' : 'en', toEN ? 'en' : 'zh-CN');
      for (const [a, b] of gloss) if (engine === 'free') t = toEN ? t.split(b).join(a) : t.split(a).join(b);
      segs.push({ src: p, dst: t, dir: toEN ? '中 → 英' : '英 → 中' });
      render();
    } catch (e) {
      status(`第 ${i + 1} 段失败：${e.message}`, true);
      $('#go').disabled = false; $('#stop').disabled = true;
      return;
    }
  }
  $('#bar>i').style.width = '100%';
  $('#go').disabled = false; $('#stop').disabled = true;
  $('#exports').style.display = 'flex';
  status(stopped ? `已停止，完成 ${segs.length}/${parts.length} 段` : `完成，共 ${segs.length} 段`);
  localStorage.setItem('doc_src', text);
  localStorage.setItem('doc_gloss', $('#gloss').value);
}

$('#go').onclick = run;
$('#stop').onclick = () => { stopped = true; };

function docHtml() {
  const rows = segs.map((s, i) =>
    `<p style="margin:0 0 4px;color:#666;font-size:10pt">#${i + 1}</p>
     <p style="margin:0 0 6px">${esc(s.src).replace(/\n/g, '<br>')}</p>
     <p style="margin:0 0 18px;font-size:12pt">${esc(s.dst).replace(/\n/g, '<br>')}</p>`).join('');
  return `<h1 style="font-size:16pt">双语对照</h1><p style="color:#888;font-size:9pt">${new Date().toLocaleString()}</p>${rows}`;
}

$('#word').onclick = () => {
  if (!segs.length) return status('还没有结果', true);
  const head = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>双语对照</title></head><body>';
  const blob = new Blob(['\ufeff' + head + docHtml() + '</body></html>'], { type: 'application/msword' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '双语对照.doc';
  a.click();
  status('已导出 Word（.doc，Word/WPS 都能打开）');
};

$('#md').onclick = () => {
  if (!segs.length) return status('还没有结果', true);
  const body = `# 双语对照\n\n> ${new Date().toLocaleString()}　共 ${segs.length} 段\n` +
    segs.map((s, i) => `\n## ${i + 1} · ${s.dir}\n\n**原文**\n\n${s.src}\n\n**译文**\n\n${s.dst}\n`).join('');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/markdown' }));
  a.download = '双语对照.md';
  a.click();
  status('已导出 Markdown');
};

$('#copy').onclick = async () => {
  if (!segs.length) return status('还没有结果', true);
  try { await navigator.clipboard.writeText(segs.map(s => s.dst).join('\n\n')); status('译文已复制'); }
  catch { status('复制失败，长按选中复制', true); }
};

$('#doc').value = localStorage.getItem('doc_src') || '';
$('#gloss').value = localStorage.getItem('doc_gloss') || localStorage.getItem('lm_gloss') || '';
refreshHint();
status('粘好原文 → 点「开始处理」');
</script>
</body>
</html>
